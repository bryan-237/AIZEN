name: Bot Keepalive 6h

on:
  workflow_dispatch:  # bouton Run manuel

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50 pour éviter la coupure à 6h
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - run: npm install --omit=dev
      
      - name: Keep alive server
        run: |
          node -e "require('http').createServer((_,r)=>r.end('ok')).listen(3000);setInterval(()=>{},60000)" &
          npm start
