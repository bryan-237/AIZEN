name: Node.js Bot Keepalive

on:
  workflow_dispatch:  # bouton Run manuel
  schedule:
    - cron: '0 */5 *'  # relance toutes les 5h auto

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub coupe à 360min max
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - run: npm install --omit=dev
      
      - name: Start bot with keepalive server
        run: |
          node -e "
          const http = require('http');
          http.createServer((req,res)=>res.end('Bot alive')).listen(3000);
          setInterval(()=>console.log('Ping keepalive'), 60000);
          " &
          npm start
